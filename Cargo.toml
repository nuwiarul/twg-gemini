[workspace]
resolver = "3"
members = [
    "crates/twg-shared",
    "crates/twg-server",
    "crates/twg-app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"

# Backend
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "limit"] }
pasetors = "0.8.1"
argon2 = { version = "0.6.0", features = ["getrandom"] }
sha2 = "0.11.1"
hex = "0.4.3"
dotenvy = "0.15.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
futures-util = "0.3.34"

# Desktop / Frontend
bevy = { version = "0.20.1", features = ["jpeg", "png", "webp", "wav", "flac"] }
bevy_egui = "0.43.1"
reqwest = { version = "0.13.5", features = ["json", "rustls", "multipart"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
crossbeam-channel = "0.5.17"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
earcutr = "0.5.0"
url = "2.5.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
